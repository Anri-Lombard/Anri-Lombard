name: Hulk smash

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  smash:
    if: startsWith(github.event.issue.title, 'smash|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `concurrency:` block: it cancels queued runs, which would drop moves.
      # Instead replay the move on the latest main until the push wins the race.
      - name: Play move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "hulk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            python game/game.py > msg.txt
            git add README.md game/state.json
            git diff --cached --quiet && break
            git commit -qm "Hulk smash by @$ISSUE_USER"
            git push -q origin HEAD:main && break
            sleep $((RANDOM % 5 + attempt))
          done
      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --comment "$(cat msg.txt)

          [Back to the profile](https://github.com/$GITHUB_REPOSITORY) to smash more."
