name: Daily profile art

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 art/build.py daily
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name "hulk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/graph-*.svg
          git diff --cached --quiet || (git commit -m "Redraw daily profile art" && git push)
