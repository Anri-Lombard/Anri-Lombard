<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150">
<style>
.wig { transform-box: fill-box; transform-origin: center; animation: wig 1.2s ease-in-out infinite; }
@keyframes wig { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(8deg) translateY(-2px) } }
.fist { animation: fist 9s cubic-bezier(.5,0,.5,1) infinite; }
.leg { stroke:#3b2a4d; stroke-width:3; stroke-linecap:round; fill:none; }
@keyframes fist { 0% { transform: translate(68px,0px); } 7% { transform: translate(68px,0px); } 12% { transform: translate(68px,34px); } 16% { transform: translate(68px,0px); } 25% { transform: translate(218px,0px); } 30% { transform: translate(218px,34px); } 34% { transform: translate(218px,0px); } 43% { transform: translate(368px,0px); } 48% { transform: translate(368px,34px); } 52% { transform: translate(368px,0px); } 61% { transform: translate(518px,0px); } 66% { transform: translate(518px,34px); } 70% { transform: translate(518px,0px); } 79% { transform: translate(668px,0px); } 84% { transform: translate(668px,34px); } 88% { transform: translate(668px,0px); } 100% { transform: translate(68px,0px); } }
@keyframes b0 { 0%,12% { opacity:1 } 12.5%,97% { opacity:0 } 100% { opacity:1 } }
@keyframes s0 { 0%,12% { opacity:0; transform:scale(.3) } 14% { opacity:1; transform:scale(1.15) } 17%,95% { opacity:1; transform:scale(1) } 98%,100% { opacity:0 } }
.b0 { animation: b0 9s linear infinite; } .s0 { transform-box: fill-box; transform-origin: center; animation: s0 9s ease-out infinite; }
@keyframes b1 { 0%,30% { opacity:1 } 30.5%,97% { opacity:0 } 100% { opacity:1 } }
@keyframes s1 { 0%,30% { opacity:0; transform:scale(.3) } 32% { opacity:1; transform:scale(1.15) } 35%,95% { opacity:1; transform:scale(1) } 98%,100% { opacity:0 } }
.b1 { animation: b1 9s linear infinite; } .s1 { transform-box: fill-box; transform-origin: center; animation: s1 9s ease-out infinite; }
@keyframes b2 { 0%,48% { opacity:1 } 48.5%,97% { opacity:0 } 100% { opacity:1 } }
@keyframes s2 { 0%,48% { opacity:0; transform:scale(.3) } 50% { opacity:1; transform:scale(1.15) } 53%,95% { opacity:1; transform:scale(1) } 98%,100% { opacity:0 } }
.b2 { animation: b2 9s linear infinite; } .s2 { transform-box: fill-box; transform-origin: center; animation: s2 9s ease-out infinite; }
@keyframes b3 { 0%,66% { opacity:1 } 66.5%,97% { opacity:0 } 100% { opacity:1 } }
@keyframes s3 { 0%,66% { opacity:0; transform:scale(.3) } 68% { opacity:1; transform:scale(1.15) } 71%,95% { opacity:1; transform:scale(1) } 98%,100% { opacity:0 } }
.b3 { animation: b3 9s linear infinite; } .s3 { transform-box: fill-box; transform-origin: center; animation: s3 9s ease-out infinite; }
@keyframes b4 { 0%,84% { opacity:1 } 84.5%,97% { opacity:0 } 100% { opacity:1 } }
@keyframes s4 { 0%,84% { opacity:0; transform:scale(.3) } 86% { opacity:1; transform:scale(1.15) } 89%,95% { opacity:1; transform:scale(1) } 98%,100% { opacity:0 } }
.b4 { animation: b4 9s linear infinite; } .s4 { transform-box: fill-box; transform-origin: center; animation: s4 9s ease-out infinite; }
</style>
